[project]
name = "herg-blocker-ml"
version = "0.1.0"
description = "hERG blocker prediction (label=0) - reproducible benchmark of fingerprint and descriptor representations"
readme = "HERG_ML.md"
requires-python = ">=3.12"
license = { text = "Internal / not for redistribution" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "rdkit>=2023.9",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "tqdm>=4.60",
]

[project.optional-dependencies]
boost = ["lightgbm>=4.0", "xgboost>=2.0"]
mordred = ["mordredcommunity>=2.0"]
tune = ["optuna>=3.4"]
explain = ["shap>=0.44"]
# convenience extras used by the reproduced run documented in reports/final_report.md
all = ["lightgbm>=4.0", "xgboost>=2.0", "mordredcommunity>=2.0", "optuna>=3.4", "shap>=0.44"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herg_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
